[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aicb"
version = "0.2.1"
description = "Open-Source AI Commerce Bot & Omnichannel Customer Service Platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Sannex Tech LTD", email = "info@sannex.ng" },
]
keywords = [
    "ai",
    "chatbot",
    "commerce",
    "whatsapp",
    "telegram",
    "agentos",
    "fastapi",
    "customer-service",
    "llm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.32",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "httpx>=0.27.0",
    "google-genai>=0.1.1",
    "openai>=1.40.0",
    "anthropic>=0.34.0",
    "cryptography>=43.0.0",
    "apscheduler>=3.10.4",
    "slowapi>=0.1.9",
    "python-multipart>=0.0.9",
    "sannex-agent>=0.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "build>=1.2.0",
    "twine>=5.1.0",
]

[project.scripts]
aicb = "app.cli:main"

[project.urls]
Homepage = "https://aicb.sannex.ng"
Documentation = "https://docs.aicb.sannex.ng"
Repository = "https://github.com/sannex-01/aicb"
Issues = "https://github.com/sannex-01/aicb/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "widget*"]

[tool.setuptools.package-data]
"*" = ["*.html", "*.css", "*.js", "*.png", "*.svg", "*.ico", "*.json"]

services:
  aicb:
    build: .
    container_name: aicb-engine
    restart: unless-stopped
    ports:
      - "${AICB_PORT:-8422}:8000"
    env_file:
      - .env
    volumes:
      - ./app:/app/app
      - ./aicb.db:/app/aicb.db
      - ../sannex-agent/packages/python/sannex_agent:/app/sannex_agent
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  miniapp:
    build: ./miniapp
    container_name: aicb-miniapp
    restart: unless-stopped
    ports:
      - "${MINIAPP_PORT:-8423}:80"
    depends_on:
      - aicb
